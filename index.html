<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo da Velha 3D</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="game-card">
      <div class="game-header">
        <h1>Jogo da Velha</h1>
      </div>

      <div class="scoreboard">
        <span class="score-label">Jogador X</span>
        <span class="score-label">Jogador O</span>
      </div>

      <section class="scene-frame">
        <div id="scene-container" aria-label="Jogo da velha em 3D"></div>
      </section>

      <div class="game-info">
        <span id="status">Vez do jogador X</span>
      </div>

      <button class="restart" id="restart">Reiniciar</button>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
